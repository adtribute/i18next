version: 2.1
orbs:
  browser-tools: circleci/browser-tools@2.3.1
jobs:
  build:
    docker:
      - image:  cimg/node:22.23.4-browsers
        environment:
          CHROME_BIN: '/usr/bin/google-chrome'
    steps:
      - checkout
      - browser-tools/install_chrome
      - restore_cache:
          key: dependency-cache-{{ checksum "package.json" }}
      - run:
          name: install-npm-wee
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package.json" }}
          paths:
            - ./node_modules
      - run:
          name: test
          command: npm test
